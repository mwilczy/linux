%YAML 1.2
---
$id: http://devicetree.org/schemas/phy/starfive,jh7110-inno-hdmi-phy.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: StarFive JH7110 Innosilicon HDMI PHY

maintainers:
  - Michal Wilczynski <m.wilczynski@samsung.com>

description:
  The PHY portion of the StarFive JH7110 HDMI IP.

properties:
  compatible:
    const: starfive,jh7110-inno-hdmi-phy

  clocks:
    maxItems: 1

  clock-names:
    const: refoclk

  '#clock-cells':
    const: 0

  clock-output-names:
    const: hdmi_pclk

  '#phy-cells':
    const: 0

  interrupts:
    maxItems: 1

required:
  - compatible
  - clocks
  - clock-names
  - '#clock-cells'
  - clock-output-names
  - '#phy-cells'

additionalProperties: false
...