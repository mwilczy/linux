%YAML 1.2
---
$id: http://devicetree.org/schemas/mfd/starfive,jh7110-hdmi-mfd.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: StarFive JH7110 HDMI MFD (Controller+PHY)

maintainers:
  - Michal Wilczynski <m.wilczynski@samsung.com>

description:
  The StarFive JH7110 HDMI block is a monolithic IP containing both
  the digital controller logic and the analog PHY logic in a single
  register space. This MFD wrapper binds to the parent node, creates
  a shared regmap, and populates the PHY and Controller as separate
  child devices to resolve driver dependencies.

properties:
  compatible:
    items:
      - const: starfive,jh7110-hdmi-mfd

  reg:
    maxItems: 1

patternProperties:
  "^phy$":
    $ref: ../phy/starfive,jh7110-inno-hdmi-phy.yaml#
  "^controller$":
    $ref: ../display/bridge/starfive,jh7110-inno-hdmi-controller.yaml#

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/starfive,jh7110-crg.h>
    #include <dt-bindings/reset/starfive,jh7110-crg.h>

    hdmi_mfd: hdmi@29590000 {
        compatible = "starfive,jh7110-hdmi-mfd", "simple-mfd";
        reg = <0x0 0x29590000 0x0 0x4000>;
        interrupts = <99>;

        hdmi_phy: phy {
            compatible = "starfive,jh7110-inno-hdmi-phy";
            clocks = <&xin24m>;
            clock-names = "refoclk";
            #clock-cells = <0>;
            clock-output-names = "hdmi_pclk";
            #phy-cells = <0>;
        };

        hdmi_controller: controller {
            compatible = "starfive,jh7110-inno-hdmi-controller";
            interrupts = <99>;
            clocks = <&voutcrg JH7110_VOUTCLK_HDMI_TX_SYS>,
                     <&voutcrg JH7110_VOUTCLK_HDMI_TX_MCLK>,
                     <&voutcrg JH7110_VOUTCLK_HDMI_TX_BCLK>,
                     <&hdmi_phy>;
            clock-names = "sys", "mclk", "bclk", "pclk";
            resets = <&voutcrg JH7110_VOUTRST_HDMI_TX_HDMI>;
            reset-names = "hdmi_tx";
            phys = <&hdmi_phy>;
            phy-names = "hdmi-phy";
        };
    };
...