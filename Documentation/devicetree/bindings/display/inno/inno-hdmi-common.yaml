%YAML 1.2
---
$id: http://devicetree.org/schemas/display/inno/inno-hdmi-common.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Common properties for the Innosilicon HDMI Transmitter

maintainers:
  - Michal Wilczynski <m.wilczynski@samsung.com>

properties:
  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  pinctrl-names:
    minItems: 1
    items:
      - const: default

  pinctrl-0:
    description: Pin control configuration.

  ports:
    $ref: /schemas/graph.yaml#/properties/ports

    properties:
      port@0:
        $ref: /schemas/graph.yaml#/properties/port
        description:
          Port node with one endpoint connected to a vop node.

      port@1:
        $ref: /schemas/graph.yaml#/properties/port
        description:
          Port node with one endpoint connected to a hdmi-connector node.

    required:
      - port@0
      - port@1

  "#sound-dai-cells":
    const: 0

required:
  - reg
  - interrupts
  - clocks
  - clock-names
  - ports
  - pinctrl-0
  - pinctrl-names

allOf:
  - $ref: /schemas/sound/dai-common.yaml#

additionalProperties: true
