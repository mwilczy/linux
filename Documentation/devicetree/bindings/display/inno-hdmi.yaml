%YAML 1.2
---
$id: http://devicetree.org/schemas/display/inno/inno-hdmi.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Innosilicon HDMI Transmitter

maintainers:
  - Sandy Huang <hjc@rock-chips.com>
  - Heiko Stuebner <heiko@sntech.de>
  - Michal Wilczynski <m.wilczynski@samsung.com>

properties:
  compatible:
    oneOf:
      - enum:
          - rockchip,rk3036-inno-hdmi
          - rockchip,rk3128-inno-hdmi
      - const: starfive,jh7110-inno-hdmi

  clocks:
    minItems: 1
    maxItems: 4

  clock-names:
    minItems: 1
    maxItems: 4

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  ports:
    $ref: /schemas/graph.yaml#/properties/ports
    properties:
      port@0:
        $ref: /schemas/graph.yaml#/properties/port
        description:
          Port node with one endpoint connected to a video source (e.g., VOP/DC).

      port@1:
        $ref: /schemas/graph.yaml#/properties/port
        description:
          Port node with one endpoint connected to an HDMI connector.
    required:
      - port@0
      - port@1

  "#sound-dai-cells":
    const: 0

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - clock-names
  - ports

allOf:
  - $ref: /schemas/sound/dai-common.yaml#

  # StarFive JH7110 Integration
  - if:
      properties:
        compatible:
          contains:
            const: starfive,jh7110-inno-hdmi
    then:
      properties:
        clocks:
          items:
            - description: System clock
            - description: Master clock for audio
            - description: Bit clock for audio
            - description: Pixel clock from VOUT
        clock-names:
          items:
            - const: sysclk
            - const: mclk
            - const: bclk
            - const: pclk
        resets:
          maxItems: 1
        reset-names:
          const: hdmi_tx
      required:
        - resets
        - reset-names

  # Rockchip Integrations
  - if:
      properties:
        compatible:
          contains:
            enum:
              - rockchip,rk3036-inno-hdmi
              - rockchip,rk3128-inno-hdmi
    then:
      properties:
        clocks:
          items:
            - description: The HDMI controller main clock (pclk)
            - description: The HDMI PHY reference clock (ref)
        clock-names:
          items:
            - const: pclk
            - const: ref
        rockchip,grf:
          $ref: /schemas/types.yaml#/definitions/phandle
          description:
            Phandle to GRF for controlling hsync/vsync polarity.
        power-domains:
          maxItems: 1

# Further nested requirements for different Rockchip SoCs
allOf:
  - if:
      properties:
        compatible:
          contains:
            const: rockchip,rk3036-inno-hdmi
    then:
      required:
        - rockchip,grf

  - if:
      properties:
        compatible:
          contains:
            const: rockchip,rk3128-inno-hdmi
    then:
      required:
        - power-domains

additionalProperties: false

examples:
  - |
    // Example for StarFive JH7110
    #include <dt-bindings/clock/starfive,jh7110-crg.h>
    #include <dt-bindings/interrupt-controller/irq.h>
    #include <dt-bindings/reset/starfive,jh7110-crg.h>

    hdmi: hdmi@29590000 {
        compatible = "starfive,jh7110-inno-hdmi";
        reg = <0x0 0x29590000 0x0 0x4000>;
        interrupts = <99>;
        clocks = <&vout_crg JH7110_VOUTCLK_HDMI_TX_SYS>,
                 <&vout_crg JH7110_VOUTCLK_HDMI_TX_MCLK>,
                 <&vout_crg JH7110_VOUTCLK_HDMI_TX_BCLK>,
                 <&hdmitx0_pixelclk>;
        clock-names = "sysclk", "mclk", "bclk", "pclk";
        resets = <&vout_crg JH7110_VOUTRST_HDMI_TX_HDMI>;
        reset-names = "hdmi_tx";

        ports {
            #address-cells = <1>;
            #size-cells = <0>;

            hdmi_in: port@0 {
                reg = <0>;
                hdmi_enc: endpoint {
                    remote-endpoint = <&dc_out_dpi0>;
                };
            };

            hdmi_out: port@1 {
                reg = <1>;
                hdmi_out_con: endpoint {
                    remote-endpoint = <&hdmi_con_in>;
                };
            };
        };
    };

  - |
    // Example for Rockchip RK3036
    #include <dt-bindings/clock/rk3036-cru.h>
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    hdmi: hdmi@20034000 {
        compatible = "rockchip,rk3036-inno-hdmi";
        reg = <0x20034000 0x4000>;
        interrupts = <GIC_SPI 45 IRQ_TYPE_LEVEL_HIGH>;
        clocks = <&cru PCLK_HDMI>, <&cru SCLK_LCDC>;
        clock-names = "pclk", "ref";
        pinctrl-names = "default";
        pinctrl-0 = <&hdmi_ctl>;
        rockchip,grf = <&grf>;
        #sound-dai-cells = <0>;

        ports {
            #address-cells = <1>;
            #size-cells = <0>;

            port@0 {
                reg = <0>;
                hdmi_in_vop: endpoint {
                    remote-endpoint = <&vop_out_hdmi>;
                };
            };

            port@1 {
                reg = <1>;
            };
        };
    };