%YAML 1.2
---
$id: http://devicetree.org/schemas/display/starfive,jh7110-inno-hdmi.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: StarFive JH7110 Innosilicon HDMI Transmitter

maintainers:
  - Michal Wilczynski <m.wilczynski@samsung.com>

allOf:
  - $ref: ../inno/inno-hdmi-common.yaml

properties:
  compatible:
    const: starfive,jh7110-inno-hdmi

  clocks:
    items:
      - description: System clock for the HDMI TX
      - description: Master clock for audio
      - description: Bit clock for audio
      - description: Pixel clock from VOUT

  clock-names:
    items:
      - const: sysclk
      - const: mclk
      - const: bclk
      - const: pclk

  resets:
    maxItems: 1

  reset-names:
    const: hdmi_tx

required:
  - compatible
  - clocks
  - clock-names
  - resets
  - reset-names

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/starfive,jh7110-crg.h>
    #include <dt-bindings/reset/starfive,jh7110-crg.h>

    hdmi: hdmi@29590000 {
        compatible = "starfive,jh7110-inno-hdmi";
        reg = <0x0 0x29590000 0x0 0x4000>;
        interrupts = <99>;
        clocks = <&voutcrg JH7110_VOUTCLK_HDMI_TX_SYS>,
                 <&voutcrg JH7110_VOUTCLK_HDMI_TX_MCLK>,
                 <&voutcrg JH7110_VOUTCLK_HDMI_TX_BCLK>,
                 <&hdmitx0_pixelclk>;
        clock-names = "sysclk", "mclk", "bclk", "pclk";
        resets = <&voutcrg JH7110_VOUTRST_HDMI_TX_HDMI>;
        reset-names = "hdmi_tx";
        #sound-dai-cells = <0>;

        ports {
            #address-cells = <1>;
            #size-cells = <0>;

            port@0 {
                reg = <0>;
                endpoint {
                    remote-endpoint = <&dc_out_dpi0>;
                };
            };

            port@1 {
                reg = <1>;
                endpoint {
                    remote-endpoint = <&hdmi_con_in>;
                };
            };
        };
    };
