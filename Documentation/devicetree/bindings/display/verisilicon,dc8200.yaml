%YAML 1.2
---
$id: http://devicetree.org/schemas/display/verisilicon,dc8200.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Verisilicon Vivante DC8200 Display Controller

description:
  Verisilicon Vivante DC8200 IP is used to transfer the image data from a
  video memory buffer to an external LCD interface.

  pipe0 binds HDMI for primary display,
  pipe1 binds DSI for external display.

          +------------------------------+
          |                              |
          |                              |
  +----+  |   +-------------------+      |   +-------+   +------+   +------+
  |    +----->+  dc controller 0  +--->----->+HDMICtl| ->+ PHY  +-->+PANEL0+
  |AXI |  |   +-------------------+      |   +-------+   +------+   +------+
  |    |  |                              |
  |    |  |                              |
  |    |  |                              |
  |    |  |                              |
  |APB |  |   +-------------------+         +---------+    +------+  +-------+
  |    +----->+  dc controller 1  +--->---->+ dsiTx   +--->+DPHY  +->+ PANEL1+
  |    |  |   +-------------------+         +---------+    +------+  +-------+
  +----+  |                              |
          +------------------------------+

maintainers:
  - Michal Wilczynski <m.wilczynski@samsung.com>

properties:
  compatible:
    - const: starfive,jh7110-dc8200
    - const: verisilicon,dc8200

  reg:
    maxItems: 3

  reg-names:
    maxItems: 3

  clocks:
    minItems: 1

  clock-names:
    minItems: 1

  resets:
    minItems: 1

  reset-names:
    minItems: 1

  interrupts:
    maxItems: 1

  ports:
    $ref: /schemas/graph.yaml#/properties/ports

    properties:
      port@0:
        $ref: /schemas/graph.yaml#/properties/port
        description:
          channel 0 output

      port@1:
        $ref: /schemas/graph.yaml#/properties/port
        description:
          channel 1 output

    required:
      - port@0
      - port@1

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - clock-names
  - ports

additionalProperties: false

allOf:
  # Constraints for StarFive JH7110
  - if:
      properties:
        compatible:
          contains:
            const: starfive,jh7110-dc8200
    then:
      properties:
        clocks:
          items::
            - description: Clock for display system noc bus.
            - description: Core clock for display controller.
            - description: Clock for axi bus to access ddr.
            - description: Clock for ahb bus to R/W the phy regs.
            - description: Pixel clock for display channel 0.
            - description: Pixel clock for display channel 1.
            - description: Pixel clock from hdmi.
            - description: Pixel clock for soc.
        clock-names:
          items:
            - const: noc_bus
            - const: dc_core
            - const: axi_core
            - const: ahb
            - const: channel0
            - const: channel1
            - const: hdmi_tx
            - const: dc_parent
        resets:
          items:
            - description: Reset for axi bus.
            - description: Reset for ahb bus.
            - description: Core reset of display controller.
        reset-names:
          items:
            - const: axi
            - const: ahb
            - const: core
      required:
        - resets
        - reset-names

examples:
  - |
    #include <dt-bindings/clock/starfive,jh7110-crg.h>
    #include <dt-bindings/reset/starfive,jh7110-crg.h>
    dc8200: lcd-controller@29400000 {
        compatible = "starfive,jh7110-dc8200";
        reg = <0x29400000 0x100>,
              <0x29400800 0x2000>;
        reg-names = "host", "base";
        interrupts = <95>;
        clocks = <&syscrg JH7110_SYSCLK_NOC_BUS_DISP_AXI>,
                 <&voutcrg JH7110_VOUTCLK_DC8200_CORE>,
                 <&voutcrg JH7110_VOUTCLK_DC8200_AXI>,
                 <&voutcrg JH7110_VOUTCLK_DC8200_AHB>,
                 <&voutcrg JH7110_VOUTCLK_DC8200_PIX0>,
                 <&voutcrg JH7110_VOUTCLK_DC8200_PIX1>,
                 <&hdmitx0_pixelclk>,
                 <&voutcrg JH7110_VOUTCLK_DC8200_PIX>;
        clock-names = "noc_bus", "dc_core", "axi_core", "ahb",
                      "channel0", "channel1", "hdmi_tx", "dc_parent";
        resets = <&voutcrg JH7110_VOUTRST_DC8200_AXI>,
                 <&voutcrg JH7110_VOUTRST_DC8200_AHB>,
                 <&voutcrg JH7110_VOUTRST_DC8200_CORE>;
        reset-names = "axi", "ahb", "core";
        ports {
            #address-cells = <1>;
            #size-cells = <0>;
            dc_out0: port@0 {
                reg = <0>;
                #address-cells = <1>;
                #size-cells = <0>;
                dc_out_dpi0: endpoint@0 {
                    reg = <0>;
                    remote-endpoint = <&hdmi_enc>;
                };
            };
            dc_out1: port@1 {
                reg = <1>;
                #address-cells = <1>;
                #size-cells = <0>;
                dc_out_dpi1: endpoint@1 {
                    reg = <1>;
                    remote-endpoint = <&dsi_enc>;
                };
            };
        };
    };
