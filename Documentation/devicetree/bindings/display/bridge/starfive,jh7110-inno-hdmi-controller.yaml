%YAML 1.2
---
$id: http://devicetree.org/schemas/display/bridge/starfive,jh7110-inno-hdmi-controller.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: StarFive JH7110 Innosilicon HDMI Controller

maintainers:
  - Michal Wilczynski <m.wilczynski@samsung.com>

description:
  The controller portion of the StarFive JH7110 INNO HDMI IP.

properties:
  compatible:
    const: starfive,jh7110-inno-hdmi-controller

  interrupts:
    maxItems: 1

  clocks:
    items:
      - description: System clock for register access
      - description: Module clock
      - description: Bus clock
      - description: Pixel clock from PHY

  clock-names:
    items:
      - const: sys
      - const: mclk
      - const: bclk
      - const: pclk

  resets:
    maxItems: 1

  reset-names:
    const: hdmi_tx

  phys:
    maxItems: 1

  phy-names:
    const: hdmi-phy

  ports:
    $ref: /schemas/graph.yaml#/properties/ports
    description:
      A graph node with one input port and one output port.

required:
  - compatible
  - interrupts
  - clocks
  - clock-names
  - resets
  - reset-names
  - phys
  - phy-names
  - ports

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/starfive,jh7110-crg.h>
    #include <dt-bindings/reset/starfive,jh7110-crg.h>

    soc {
        #address-cells = <1>;
        #size-cells = <1>;

        hdmi_mfd: hdmi@29590000 {
            compatible = "starfive,jh7110-hdmi-mfd";
            reg = <0x29590000 0x4000>;

            hdmi_phy: phy {
                compatible = "starfive,jh7110-inno-hdmi-phy";
                clocks = <&xin24m>;
                clock-names = "refoclk";
                #clock-cells = <0>;
                clock-output-names = "hdmi_pclk";
                #phy-cells = <0>;
            };

            hdmi_controller: controller {
                compatible = "starfive,jh7110-inno-hdmi-controller";
                interrupts = <99>;
                clocks = <&voutcrg JH7110_VOUTCLK_HDMI_TX_SYS>,
                         <&voutcrg JH7110_VOUTCLK_HDMI_TX_MCLK>,
                         <&voutcrg JH7110_VOUTCLK_HDMI_TX_BCLK>,
                         <&hdmi_phy>;
                clock-names = "sys", "mclk", "bclk", "pclk";
                resets = <&voutcrg JH7110_VOUTRST_HDMI_TX_HDMI>;
                reset-names = "hdmi_tx";
                phys = <&hdmi_phy>;
                phy-names = "hdmi-phy";

                ports {
                    #address-cells = <1>;
                    #size-cells = <0>;

                    port@0 {
                        reg = <0>;
                        hdmi_in: endpoint {
                            remote-endpoint = <&dpu_out_dpi0>;
                        };
                    };

                    port@1 {
                        reg = <1>;
                        hdmi_out: endpoint {
                            remote-endpoint = <&hdmi_con_in>;
                        };
                    };
                };
            };
        };
    };

...
