%YAML 1.2
---
$id: http://devicetree.org/schemas/display/bridge/starfive,jh7110-inno-hdmi-controller.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: StarFive JH7110 Innosilicon HDMI Controller

maintainers:
  - Michal Wilczynski <m.wilczynski@samsung.com>

description:
  The controller portion of the StarFive JH7110 HDMI IP.

properties:
  compatible:
    const: starfive,jh7110-inno-hdmi-controller

  interrupts:
    maxItems: 1

  clocks:
    minItems: 4
    maxItems: 4

  clock-names:
    items:
      - const: sys
      - const: mclk
      - const: bclk
      - const: pclk

  resets:
    maxItems: 1

  reset-names:
    const: hdmi_tx

  phys:
    maxItems: 1

  phy-names:
    const: hdmi-phy

required:
  - compatible
  - interrupts
  - clocks
  - clock-names
  - resets
  - reset-names
  - phys
  - phy-names

additionalProperties: false
...